name: Windows UI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell, XAML, UI states and navigation
        shell: powershell
        run: .\Test-UI.ps1
      - name: Keep UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freescreen-ui-previews
          path: .local/ui-tests/*.png
